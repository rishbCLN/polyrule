name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate rules, presets, and targets
        run: node compile.mjs --check
      - name: Run test suite
        run: node --test
      - name: Smoke-compile every preset (dry run)
        shell: bash
        run: |
          set -euo pipefail
          presets=$(node --input-type=module -e "import fs from 'node:fs'; console.log(Object.keys(JSON.parse(fs.readFileSync('config/presets.json','utf8'))).join(' '))")
          for preset in $presets; do
            echo "--- $preset ---"
            node compile.mjs --preset "$preset" --target all --dry-run
          done
